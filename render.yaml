services:
  - type: web
    name: repopulse-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/config
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_PATH
        value: /tmp/repopulse.db
      - key: RATE_LIMIT_PER_MIN
        value: "30"
