name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check API URL
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Repository variable API_URL is empty. Set Settings > Secrets and variables > Actions > Variables > API_URL to your Render API origin."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: frontend
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.API_URL }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          export VITE_BASE="/$REPOSITORY_NAME/"
          npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
